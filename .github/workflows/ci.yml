name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-type:
    name: Backend · ruff + mypy
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy app

  backend-test:
    name: Backend · pytest (SQLite)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        env:
          SCHOLARHUB_ENVIRONMENT: test
          SCHOLARHUB_SECRET_KEY: TEST_ONLY_DO_NOT_USE_IN_PRODUCTION_0123456789abcdef
          SCHOLARHUB_ADMIN_PASSWORD: test_admin_password_12345
        run: uv run pytest -q

  rls-isolation:
    name: Backend · RLS isolation (PostgreSQL 17)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scholarhub
          POSTGRES_PASSWORD: scholarhub
          POSTGRES_DB: scholarhub_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholarhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run RLS isolation tests
        env:
          SCHOLARHUB_ENVIRONMENT: test
          SCHOLARHUB_SECRET_KEY: TEST_ONLY_DO_NOT_USE_IN_PRODUCTION_0123456789abcdef
          SCHOLARHUB_ADMIN_PASSWORD: test_admin_password_12345
          SCHOLARHUB_DATABASE_URL: postgresql+asyncpg://scholarhub:scholarhub@localhost:5432/scholarhub_rls
        run: uv run pytest tests/test_rls_isolation.py -v

  frontend:
    name: Frontend · lint + typecheck + build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

# ScholarHUB CI — lint, typecheck, unit & E2E tests。
#
# 在 push / pull request 到 main 时触发。E2E 测试需安装 Playwright 浏览器
# 并启动前后端服务（由 Playwright config 的 webServer 自动管理）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHOLARHUB_ENVIRONMENT: test

jobs:
  # ─── 后端：lint + mypy + 单元测试 ──────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Unit tests (pytest)
        run: uv run pytest -v --tb=short
        # RLS 隔离测试需要真实 PostgreSQL，由下方独立 rls job 门禁执行。

  # ─── RLS 租户隔离测试（真实 PostgreSQL 17）─────────────────────────────────
  # tests/test_rls_isolation.py 在非 PostgreSQL 环境下整模块跳过 —— 意味着
  # 「双层租户隔离」这一安全特性若没有本 job，CI 里永远零覆盖。
  rls:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scholarhub
          POSTGRES_PASSWORD: scholarhub
          POSTGRES_DB: scholarhub
          # Ephemeral CI container: skip password negotiation entirely so the
          # fixture's dynamically-created non-superuser role can connect
          # regardless of the image's password_encryption settings.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholarhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: RLS isolation tests (PostgreSQL)
        run: uv run pytest tests/test_rls_isolation.py -v --tb=short
        env:
          SCHOLARHUB_DATABASE_URL: postgresql+asyncpg://scholarhub:scholarhub@localhost:5432/scholarhub

  # ─── 前端：lint + typecheck + unit tests ──────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

  # ─── E2E 测试：Playwright (chromium) ─────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: apps/backend

      - name: Install Playwright chromium
        run: npx playwright install chromium

      - name: Run E2E tests (chromium)
        run: npx playwright test --project=chromium
        env:
          # Playwright 的 webServer 配置会自启后端 + 前端。
          E2E_SPAWN_SERVER: "1"

      - name: Run E2E tests (mobile viewport)
        run: npx playwright test --project=mobile
        env:
          E2E_SPAWN_SERVER: "1"

name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-backend:
    name: build backend wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: 0.5.10
          enable-cache: true
          cache-dependency-glob: 'apps/backend/uv.lock'
      - name: Set up Python
        run: uv python install 3.12
      - name: Build wheel + sdist
        run: uv build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scholarhub-backend
          path: apps/backend/dist/*

  docker-image:
    name: docker image
    runs-on: ubuntu-latest
    needs: build-backend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/scholarhub-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/scholarhub-backend:latest

  github-release:
    name: github release
    runs-on: ubuntu-latest
    needs: [build-backend, docker-image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/backend/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}